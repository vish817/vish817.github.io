<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101a36">
  <title>Home</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #f8fafc;
      background:
        radial-gradient(circle at 15% 15%, rgba(76, 110, 245, .35), transparent 34%),
        radial-gradient(circle at 85% 80%, rgba(168, 85, 247, .28), transparent 32%),
        linear-gradient(135deg, #0b1228, #18264a 55%, #111827);
    }
    .glow {
      position: fixed;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      filter: blur(70px);
      opacity: .35;
      pointer-events: none;
    }
    .glow.one { background: #4f46e5; top: -70px; right: -40px; }
    .glow.two { background: #06b6d4; bottom: -90px; left: -50px; }
    main {
      position: relative;
      width: min(100%, 560px);
      padding: clamp(32px, 8vw, 58px) 26px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 28px;
      background: rgba(255,255,255,.09);
      box-shadow: 0 28px 80px rgba(0,0,0,.35);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .mark {
      width: 58px; height: 58px;
      display: grid; place-items: center;
      margin: 0 auto 22px;
      border-radius: 18px;
      background: linear-gradient(135deg, #60a5fa, #8b5cf6);
      box-shadow: 0 10px 28px rgba(96,165,250,.28);
      font-size: 27px;
    }
    .eyebrow {
      margin: 0 0 12px;
      color: #b9c8f5;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.8rem, 12vw, 4.5rem);
      line-height: 1.05;
      letter-spacing: -.055em;
    }
    p {
      max-width: 370px;
      margin: 18px auto 30px;
      color: #d2daf0;
      font-size: clamp(1rem, 4vw, 1.12rem);
      line-height: 1.7;
    }
    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 27px;
      border-radius: 14px;
      color: #101a36;
      background: linear-gradient(100deg, #a5d8ff, #c4b5fd);
      font-weight: 750;
      text-decoration: none;
      box-shadow: 0 12px 30px rgba(96,165,250,.2);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    a.button:hover { transform: translateY(-3px); box-shadow: 0 16px 34px rgba(96,165,250,.3); }
    .foot {
      margin: 28px 0 0;
      color: #9eacd0;
      font-size: .82rem;
      letter-spacing: .02em;
    }
    @media (prefers-reduced-motion: no-preference) {
      main { animation: rise .7s ease both; }
      @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    }
  </style>
</head>
<body>
  <div class="glow one"></div>
  <div class="glow two"></div>
  <main>
    <div class="mark" aria-hidden="true">⌂</div>
    <div class="eyebrow">A little place on the web</div>
    <h1>Home</h1>
    <p>Welcome to my website. Simple beginnings, endless possibilities.</p>
    <p>I am Vishal a BA graduate </p>
    <a class="button" href="#welcome" onclick="document.getElementById('welcome').textContent='Thanks for visiting Home!'">Explore Home</a>
    <div class="foot" id="welcome">Made with care · Welcome</div>
  </main>
</body>
</html>
