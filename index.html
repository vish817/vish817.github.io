<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Toolify — free online image, PDF, file, text and daily utility tools.">
<title>Toolify — All-in-One Online Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#182443;--muted:#667493;--line:#dce5f5;--purple:#7057ed;--blue:#477eea;--bg:#f3f6ff;--card:#fff;--soft:#edf2ff;--shadow:0 10px 30px rgba(48,72,130,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#f4f7ff,#f8f4ff);min-height:100vh}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:15px max(5%,calc((100% - 1200px)/2))}
.logo{font-size:27px;font-weight:800;color:var(--purple);letter-spacing:-1px}.logo span{color:var(--ink)}nav{display:flex;gap:20px}nav a{color:var(--ink);text-decoration:none;font-size:14px;font-weight:600}
.hero{text-align:center;padding:54px 16px 34px}.eyebrow{display:inline-block;background:#e9e7ff;color:#5945ce;padding:8px 13px;border-radius:30px;font-size:12px;font-weight:700}.hero h1{font-size:clamp(32px,6vw,54px);letter-spacing:-2px;margin:16px 0 10px}.hero h1 span{color:var(--purple)}.hero p{color:var(--muted);margin:0 auto 22px;max-width:600px;line-height:1.6}
.search{width:min(650px,94%);padding:17px 20px;border:1px solid #cbd7f1;border-radius:15px;background:#fff;font-size:15px;box-shadow:var(--shadow);outline:none;color:var(--ink)}.search:focus{border-color:var(--purple)}
.wrap{max-width:1200px;margin:auto;padding:0 22px 60px}.quick{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:20px 0 34px}.chip{border:1px solid var(--line);background:#fff;border-radius:30px;padding:9px 14px;color:#4c5c80;font-size:12px;font-weight:700;cursor:pointer}.chip.active,.chip:hover{background:#eeeaff;color:#5945ce;border-color:#cfc7ff}
.category{margin:32px 0}.cat-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:16px}.cat-head h2{font-size:22px;margin:0}.cat-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.tool{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px;text-align:left;cursor:pointer;box-shadow:0 4px 16px rgba(48,72,130,.035);transition:.2s;min-height:137px;color:var(--ink)}.tool:hover{transform:translateY(-3px);border-color:#b8adff;box-shadow:var(--shadow)}.ico{width:42px;height:42px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:22px}.tool h3{font-size:14px;margin:12px 0 5px}.tool p{font-size:12px;color:var(--muted);margin:0;line-height:1.45}
.workspace{display:none;background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;margin:25px 0;box-shadow:var(--shadow)}.workspace.show{display:block}.worktop{display:flex;justify-content:space-between;gap:12px;align-items:center}.worktop h2{margin:0;font-size:22px}.close{border:0;background:#eef1fa;border-radius:10px;padding:9px 12px;cursor:pointer}.desc{color:var(--muted);font-size:13px;line-height:1.5}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:16px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#506080}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d4def1;border-radius:10px;background:#fbfcff;color:var(--ink);font:inherit;font-size:14px}.field textarea{min-height:120px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:10px;padding:12px 17px;color:#fff;background:linear-gradient(90deg,var(--purple),#9870f5);font-weight:700;cursor:pointer}.btn.secondary{background:#edf1ff;color:#394b78}.btn:disabled{opacity:.5;cursor:not-allowed}.result{margin-top:15px;padding:13px;border-radius:12px;background:#f0fbf6;color:#16734b;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;display:none}.result.show{display:block}.preview{max-width:100%;max-height:360px;border-radius:12px;margin-top:14px;display:block}.status{color:var(--muted);font-size:12px;margin-top:9px}
footer{border-top:1px solid var(--line);background:#fff;padding:28px 20px;text-align:center;color:var(--muted);font-size:13px}
@media(max-width:850px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){header{padding:13px 18px}nav{gap:10px}nav a{font-size:12px}.hero{padding-top:38px}.wrap{padding:0 14px 40px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tool{padding:14px;min-height:130px}.controls{grid-template-columns:1fr}.workspace{padding:16px}.cat-head h2{font-size:19px}}
.notice{max-width:900px;margin:0 auto 24px;padding:12px 15px;border:1px solid #d9def8;border-radius:13px;background:#f0efff;color:#51458d;font-size:12px;line-height:1.55}.tool:focus-visible,.chip:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #a99aff;outline-offset:2px}.result{user-select:text}.worktop{position:sticky;top:65px;background:#fff;padding:5px 0;z-index:2}
</head>
<body>
<header><div class="logo">Tool<span>ify.</span></div><nav><a href="#tools">Explore Tools</a><a href="#about">About</a></nav></header>
<section class="hero"><span class="eyebrow">50 SMART ONLINE UTILITIES</span><h1>Make Your Work <span>Easy.</span></h1><p>Fast, simple tools for images, PDFs, files, text and everyday tasks. Browse all 50 tools below.</p><input id="search" class="search" placeholder="Search any tool..." autocomplete="off"></section>
<main class="wrap" id="tools"><div class="notice">Your files stay on your device for browser-based tools. A few advanced tools are clearly marked as requiring a separate server; they will not pretend to work when that service is unavailable.</div><div class="quick" id="quick"></div><section id="workspace" class="workspace"><div class="worktop"><h2 id="workTitle">Tool</h2><button class="close" id="closeWork">✕ Close</button></div><p class="desc" id="workDesc"></p><div id="controls" class="controls"></div><div class="actions" id="actions"></div><div id="result" class="result"></div><div id="previewArea"></div><div class="status" id="status"></div></section><div id="categories"></div></main>
<footer id="about"><strong>Toolify.</strong><p>Simple • Fast • Useful</p><p>© 2026 Toolify. All rights reserved.</p><small>Privacy-first: supported tools process files in your browser. Background removal and password-protected PDF features need a separate secure server and are not enabled in this GitHub Pages release.</small></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="app.js"></script>
</body></html>
